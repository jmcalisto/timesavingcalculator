<!DOCTYPE html>
<html>
<head>
<style>
  /* Base Styles */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background-color: transparent; 
    padding: 20px;
    margin: 0;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    border-top: 5px solid #003359; /* WSE Blue Accent */
  }

  /* Typography */
  h2 {
    color: #003359; /* WSE Blue */
    margin-top: 0;
    font-size: 28px;
    font-weight: 700;
  }

  p.instruction {
    font-size: 18px;
    color: #4a4a4a;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  p.sub-instruction {
    font-size: 14px;
    color: #888;
    margin-top: 0;
    margin-bottom: 30px;
    font-style: italic;
  }

  /* Slider Styling */
  .slider-container {
    position: relative;
    padding: 10px 0;
  }

  input[type=range] {
    width: 100%;
    margin: 15px 0;
    cursor: pointer;
    accent-color: #003359; /* Slides blue on modern browsers */
    height: 8px;
    background: #e0e0e0;
    border-radius: 5px;
    outline: none;
  }

  /* Make the "Thumb" (Handle) bigger for easier clicking */
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #003359;
    cursor: pointer;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
  }

  .slider-value {
    font-weight: bold;
    font-size: 24px;
    color: #003359;
    display: block;
    margin-bottom: 10px;
  }

  /* Results Styling */
  .result-box {
    background-color: #f7f9fc;
    border-radius: 8px;
    padding: 25px;
    margin-top: 25px;
    border: 1px solid #e1e8ed;
    transition: transform 0.2s ease;
  }

  .big-impact {
    font-size: 28px;
    font-weight: 800;
    color: #f12c3e; /* WSE Red */
    display: block;
    margin-bottom: 10px;
  }

  .sub-impact {
    font-size: 18px;
    color: #003359; /* WSE Blue */
    font-weight: 500;
  }

  /* Simple animation class */
  .pulse {
    animation: pulse-animation 0.5s;
  }

  @keyframes pulse-animation {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

</style>
</head>
<body onload="init()"> <div class="container">
  <h2 id="title">AI Time-Saving Calculator</h2>

  <p class="instruction" id="instruction">
    How many <strong>HOURS A WEEK</strong> do you spend on admin tasks, scheduling, formatting, notetaking?
  </p>

  <p class="instruction" id="subInstruction">
    👇 Use the slider below to estimate your time
  </p>

  <div class="slider-container">
    <span class="slider-value"><span id="hoursDisplay">5</span> <span id="hoursUnit">hours</span></span>
    <input type="range" id="hoursInput" min="0" max="20" value="5" oninput="calculate()">
  </div>

  <div class="result-box" id="resultBox">
    <span id="annualResult" class="big-impact">AI can save you 240 hours</span>
    <span class="sub-impact" id="weeksLine">That's <span id="weeksResult">6.0</span> full work weeks per year</span>
  </div>
</div>

<script>
var STRINGS = {
  en: {
    htmlLang: "en",
    title: "AI Time-Saving Calculator",
    instruction: 'How many <strong>HOURS A WEEK</strong> do you spend on admin tasks, scheduling, formatting, notetaking?',
    subInstruction: "👇 Use the slider below to estimate your time",
    hoursUnit: "hours",
    annualResult: function(h) { return "AI can save you " + h + " hours"; },
    weeksLine: function(w) { return "That's <span id=\"weeksResult\">" + w + "</span> full work weeks per year"; }
  },
  zh: {
    htmlLang: "zh-CN",
    title: "AI 节省时间计算器",
    instruction: '您<strong>每周</strong>花多少<strong>小时</strong>在行政工作、日程安排、格式编辑和会议记录上？',
    subInstruction: "👇 使用下方滑块估算您的时间",
    hoursUnit: "小时",
    annualResult: function(h) { return "AI 每年可为您节省 " + h + " 小时"; },
    weeksLine: function(w) { return "相当于每年 <span id=\"weeksResult\">" + w + "</span> 个完整工作周"; }
  },
  ko: {
    htmlLang: "ko",
    title: "AI 시간 절약 계산기",
    instruction: '행정 업무, 일정 관리, 문서 작성, 회의록 작성에 <strong>일주일에 몇 시간</strong>을 사용하시나요?',
    subInstruction: "👇 아래 슬라이더로 시간을 추정해보세요",
    hoursUnit: "시간",
    annualResult: function(h) { return "AI가 연간 " + h + "시간을 절약해 드립니다"; },
    weeksLine: function(w) { return "이는 연간 <span id=\"weeksResult\">" + w + "</span>주간의 업무 시간에 해당합니다"; }
  }
};

function getLang() {
  var params = new URLSearchParams(window.location.search);
  var lang = (params.get("lang") || "en").toLowerCase();
  return STRINGS[lang] ? lang : "en";
}

var LANG = getLang();
var T = STRINGS[LANG];

function init() {
  document.documentElement.setAttribute("lang", T.htmlLang);
  document.getElementById("title").innerText = T.title;
  document.getElementById("instruction").innerHTML = T.instruction;
  document.getElementById("subInstruction").innerText = T.subInstruction;
  document.getElementById("hoursUnit").innerText = T.hoursUnit;
  calculate();
}

function calculate() {
  var weekly = document.getElementById("hoursInput").value;
  var annual = weekly * 48;
  var weeksLost = (annual / 40).toFixed(1);

  document.getElementById("hoursDisplay").innerText = weekly;
  document.getElementById("annualResult").innerText = T.annualResult(annual);
  document.getElementById("weeksLine").innerHTML = T.weeksLine(weeksLost);

  var box = document.getElementById("resultBox");
  box.classList.remove("pulse");
  void box.offsetWidth;
  box.classList.add("pulse");
}
</script>

</body>
</html>
